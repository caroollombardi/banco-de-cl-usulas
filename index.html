<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Cláusulas — Wolff e Scripes</title>
<style>
/* ============================================================================
   TOKENS — escala fechada. Cinco degraus de tipografia, seis de espaço, três
   de raio. Nada de valor solto: se precisar de um tamanho novo, entra aqui.
   ========================================================================= */
:root{
  /* superfícies e tinta */
  --paper:#F8F7F4; --paper2:#F3F1EC; --surface:#FFFFFF;
  --line:#E7E3DD; --line2:#EFECE6; --line3:#DCD7D0;
  --ink:#1F1D1B; --ink2:#6B655E; --ink3:#4A453F; --ink4:#A8A29A;
  /* marca */
  --acc:#FB7435; --acc-btn:#E8672C; --acc-btn-h:#D2551D; --acc-soft:#FDF0E9;
  /* estados */
  --ok:#1C6B45; --ok-bg:#E8F1EA; --warn:#8A5A0B; --warn-bg:#FBF2E1;
  --bad:#A63A2C; --bad-bg:#F9E9E6; --info:#2A5687; --info-bg:#EAF0F7;
  /* tipografia: 5 degraus */
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12.5px; --fs-ui:13.5px;
  --fs-base:15px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:30px;
  --lh-tight:1.25; --lh-base:1.55; --lh-read:1.7;
  --w-reg:400; --w-med:500; --w-semi:600;
  --tr-wide:.09em; --tr-eyebrow:.17em;
  /* espaço: 6 degraus */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  /* raio e movimento */
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --dur:.16s;
  /* medidas da casca */
  --h-top:64px; --w-side:220px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
  background:var(--paper);color:var(--ink);font-size:var(--fs-base);line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ============================================================================
   PORTÃO DE ACESSO
   ========================================================================= */
#gate{--g-bg:#F7F6F2;--g-bg2:#FCFCFB;--g-line2:#EDEAE5;
  display:none;position:fixed;inset:0;background:var(--g-bg);z-index:200;overflow:auto}
#gwrap{min-height:100%;display:grid;grid-template-columns:45fr 55fr}
#gbrand{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  padding:56px clamp(32px,6vw,88px);border-right:1px solid rgba(31,29,27,.055)}
#gmark{display:block;width:clamp(268px,26vw,392px);height:auto}
#geyebrow{font-size:var(--fs-xs);font-weight:var(--w-semi);letter-spacing:var(--tr-eyebrow);
  color:var(--ink2);margin-top:11px;text-transform:uppercase;padding-left:2px}
#grule{width:38px;height:2px;background:var(--acc);margin-top:9px}
#ghead{font-size:clamp(30px,3.4vw,45px);font-weight:var(--w-semi);line-height:1.09;
  margin-top:24px;max-width:13.5em;letter-spacing:-.021em}
#gsub{font-size:var(--fs-base);line-height:1.6;color:var(--ink3);margin-top:20px;max-width:25em}
#gtex{position:absolute;inset:0;pointer-events:none}
#gtex i{position:absolute;background:var(--ink);opacity:.05}
#gform{position:relative;z-index:1;background:var(--g-bg2);display:flex;align-items:center;
  justify-content:flex-start;padding:48px clamp(24px,4vw,72px)}
.gbox{width:min(380px,100%);margin-bottom:52px}
.geyebrow2{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink2);margin-bottom:34px}
.gfield{margin-bottom:26px}
.gfield label{display:block;font-size:var(--fs-xs);font-weight:var(--w-semi);letter-spacing:.04em;
  color:var(--ink3);margin-bottom:var(--s1)}
.gbox input{width:100%;height:40px;font-size:var(--fs-base);padding:0 0 2px;border:none;
  border-bottom:1px solid var(--line3);border-radius:0;background:transparent;transition:border-color var(--dur)}
.gbox input::placeholder{color:var(--ink4)}
.gbox input::-ms-reveal,.gbox input::-ms-clear{display:none}
.gbox input:hover{border-bottom-color:var(--line3)}
.gbox input:focus{outline:none;border-bottom-color:var(--acc);box-shadow:0 1px 0 0 var(--acc)}
.gpwrap{position:relative}
.gpwrap input{padding-right:38px}
#gtoggle{position:absolute;right:0;top:4px;width:32px;height:32px;border-radius:var(--r-md);
  color:var(--ink4);display:flex;align-items:center;justify-content:center}
#gtoggle:hover{color:var(--ink)}
.gaux{margin:-12px 0 32px}
.glink{font-size:var(--fs-sm);color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.glink:hover{color:var(--ink)}
.gbtn{height:44px;min-width:132px;padding:0 30px;background:var(--acc-btn);color:#FFFFFF;
  border-radius:var(--r-md);font-size:var(--fs-base);font-weight:var(--w-semi);transition:background var(--dur)}
.gbtn:hover{background:var(--acc-btn-h)}
.gbtn[disabled]{opacity:.55;cursor:default}
.gmsg{font-size:var(--fs-sm);color:var(--ink2);margin-top:18px;max-width:34em}
.gmsg.erro{color:var(--bad)}
.gbox h2{font-size:var(--fs-xl);font-weight:var(--w-semi);letter-spacing:-.01em}
.gbox .glead{font-size:var(--fs-base);color:var(--ink2);margin-top:var(--s2);margin-bottom:34px}

/* ============================================================================
   CASCA — header discreto, sidebar quase integrada ao fundo
   ========================================================================= */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex}
header{height:var(--h-top);flex-shrink:0;display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s6);background:var(--paper);border-bottom:1px solid var(--line)}
#hbrand{display:flex;align-items:baseline;gap:var(--s3);min-width:0}
#hlogo{height:17px;width:auto;opacity:.92}
#hsep{width:1px;height:15px;background:var(--line3)}
#hprod{font-size:var(--fs-sm);font-weight:var(--w-semi);letter-spacing:var(--tr-wide);
  text-transform:uppercase;color:var(--ink2);white-space:nowrap}
#hbeta{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:.1em;text-transform:uppercase;
  color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:var(--r-sm);cursor:pointer}
#hsearch{margin-left:auto;display:flex;align-items:center;gap:var(--s2);width:min(320px,34vw);
  height:34px;padding:0 var(--s3);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);color:var(--ink4);transition:border-color var(--dur)}
#hsearch:focus-within{border-color:var(--line3)}
#hsearch input{flex:1;border:none;outline:none;background:none;font-size:var(--fs-sm);color:var(--ink)}
#hkbd{font-size:var(--fs-2xs);color:var(--ink4);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 5px}
#huser{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2);border-radius:var(--r-md);
  font-size:var(--fs-sm);color:var(--ink3)}
#huser:hover{background:var(--paper2)}
#havatar{width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc-btn-h);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:var(--w-semi)}
#body{flex:1;display:grid;grid-template-columns:var(--w-side) minmax(0,1fr);min-height:0}
nav{padding:var(--s6) var(--s3) var(--s6) var(--s6);border-right:1px solid var(--line)}
.ngroup{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;
  color:var(--ink4);margin:var(--s8) 0 var(--s3) var(--s2)}
.ngroup:first-child{margin-top:0}
.nitem{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);width:100%;
  padding:7px var(--s3);border-radius:var(--r-md);font-size:var(--fs-ui);color:var(--ink3);text-align:left;
  transition:background var(--dur)}
.nitem:hover{background:var(--paper2)}
.nitem.on{color:var(--ink);font-weight:var(--w-semi);box-shadow:inset 2px 0 0 0 var(--acc);
  border-radius:0 var(--r-md) var(--r-md) 0;background:transparent}
.nitem.on:hover{background:var(--paper2)}
.ncount{font-size:var(--fs-xs);color:var(--ink4);font-variant-numeric:tabular-nums}
.nitem.on .ncount{color:var(--ink2)}
main{padding:var(--s12) clamp(var(--s6),4vw,64px);max-width:1180px}

/* ============================================================================
   LANDING ADAPTATIVA
   ========================================================================= */
.eyebrow{font-size:var(--fs-xs);font-weight:var(--w-semi);letter-spacing:var(--tr-eyebrow);
  text-transform:uppercase;color:var(--ink2)}
h1{font-size:var(--fs-2xl);font-weight:var(--w-semi);line-height:1.14;letter-spacing:-.018em;margin-top:var(--s3)}
.lead{font-size:var(--fs-base);color:var(--ink3);line-height:var(--lh-read);margin-top:var(--s4);max-width:44em}
#lprog{margin-top:var(--s12);padding-top:var(--s6);border-top:1px solid var(--line);max-width:520px}
.pgline{display:flex;align-items:baseline;justify-content:space-between;margin-top:var(--s4)}
.pgline span{font-size:var(--fs-lg);font-weight:var(--w-semi)}
.pgpct{color:var(--ink2)}
.pgbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:var(--s3)}
.pgbar i{display:block;height:100%;background:var(--ok);transition:width var(--dur)}
.pgnote{font-size:var(--fs-sm);color:var(--ink2);margin-top:var(--s3)}
.cta{display:inline-flex;align-items:center;gap:var(--s2);height:44px;padding:0 var(--s6);
  background:var(--acc-btn);color:#FFFFFF;border-radius:var(--r-md);font-size:var(--fs-base);font-weight:var(--w-semi);
  margin-top:var(--s8);transition:background var(--dur)}
.cta:hover{background:var(--acc-btn-h)}
.cta-ghost{display:inline-flex;align-items:center;gap:var(--s2);height:44px;padding:0 var(--s4);
  border:1px solid var(--line3);border-radius:var(--r-md);font-size:var(--fs-ui);color:var(--ink3);
  margin:var(--s8) 0 0 var(--s3)}
.cta-ghost:hover{background:var(--surface)}
#lbusca{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s8);height:56px;
  padding:0 var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
#lbusca input{flex:1;border:none;outline:none;background:none;font-size:var(--fs-base)}

/* ============================================================================
   ÁRVORE — documento > tema > cláusula
   ========================================================================= */
.tabs{display:flex;gap:var(--s1);margin:var(--s6) 0 var(--s6)}
.tab{padding:6px var(--s3);border-radius:var(--r-md);font-size:var(--fs-ui);color:var(--ink2)}
.tab:hover{background:var(--paper2)}
.tab.on{background:var(--surface);color:var(--ink);font-weight:var(--w-semi);box-shadow:inset 0 0 0 1px var(--line)}
.tabcount{font-size:var(--fs-xs);color:var(--ink4);margin-left:var(--s1);font-variant-numeric:tabular-nums}
.doc{border-bottom:1px solid var(--line)}
.doc:first-of-type{border-top:1px solid var(--line)}
.dhead{display:flex;align-items:center;gap:var(--s4);width:100%;padding:var(--s4) var(--s2);text-align:left}
.dhead:hover{background:var(--paper2)}
.dcar{width:12px;flex-shrink:0;color:var(--ink4);font-size:var(--fs-2xs);transition:transform var(--dur)}
.dhead[aria-expanded="true"] .dcar{transform:rotate(90deg)}
.dname{font-size:var(--fs-base);font-weight:var(--w-med);flex:1;min-width:0}
.dprog{display:flex;align-items:center;gap:var(--s3);flex-shrink:0}
.dfrac{font-size:var(--fs-sm);color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{width:64px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.temas{padding:0 0 var(--s3) 28px}
.tema{padding:var(--s2) 0}
.thead{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2);text-align:left;
  border-radius:var(--r-md)}
.thead:hover{background:var(--paper2)}
.tname{font-size:var(--fs-ui);color:var(--ink3);flex:1}
.tfrac{font-size:var(--fs-xs);color:var(--ink4);font-variant-numeric:tabular-nums}
.cl{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2) var(--s3);text-align:left;
  border-radius:var(--r-md);border-left:2px solid var(--line);margin-left:var(--s3)}
.cl:hover{background:var(--surface);border-left-color:var(--acc)}
.clname{font-size:var(--fs-base);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clid{font-size:var(--fs-xs);color:var(--ink4);font-variant-numeric:tabular-nums;flex-shrink:0}
.vazio{padding:var(--s12) 0;color:var(--ink2);font-size:var(--fs-base)}

/* etiquetas de estado */
.et{font-size:var(--fs-xs);font-weight:var(--w-semi);padding:2px 8px;border-radius:var(--r-sm);
  white-space:nowrap;flex-shrink:0}
.et-val{background:var(--ok-bg);color:var(--ok)}
.et-emv{background:var(--paper2);color:var(--ink2)}
.et-apr{background:var(--ok-bg);color:var(--ok)}
.et-aju{background:var(--warn-bg);color:var(--warn)}
.et-rej{background:var(--bad-bg);color:var(--bad)}
.et-div{background:var(--info-bg);color:var(--info)}
.et-risco-Alto{background:var(--bad-bg);color:var(--bad)}
.et-risco-Médio{background:var(--warn-bg);color:var(--warn)}
.et-risco-Baixo{background:var(--ok-bg);color:var(--ok)}

/* ============================================================================
   DETALHE DA CLÁUSULA — documento, não modal
   ========================================================================= */
#det{display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:var(--s12)}
.crumb{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);color:var(--ink2);flex-wrap:wrap}
.crumb button{color:var(--ink2);text-decoration:underline;text-underline-offset:2px;font-size:var(--fs-sm)}
.crumb button:hover{color:var(--ink)}
#dtit{font-size:var(--fs-xl);font-weight:var(--w-semi);letter-spacing:-.012em;margin-top:var(--s3)}
#dstat{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);flex-wrap:wrap}
#daviso{margin-top:var(--s4);padding:var(--s3) var(--s4);background:var(--warn-bg);color:var(--warn);
  border-radius:var(--r-md);font-size:var(--fs-sm);line-height:var(--lh-base)}
.sec{margin-top:var(--s12)}
.slabel{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;
  color:var(--ink4);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
#dtexto{margin-top:var(--s4);padding:var(--s6);background:var(--surface);border:1px solid var(--line2);
  border-radius:var(--r-md);font-size:var(--fs-base);line-height:var(--lh-read);white-space:pre-wrap}
.par{padding:var(--s4) 0;border-bottom:1px solid var(--line2)}
.par:last-child{border-bottom:none}
.parhead{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.parwho{font-size:var(--fs-ui);font-weight:var(--w-med)}
.parpapel{font-size:var(--fs-xs);color:var(--ink4)}
.parwhen{font-size:var(--fs-xs);color:var(--ink4);margin-left:auto}
.parcom{font-size:var(--fs-base);color:var(--ink3);line-height:var(--lh-read);margin-top:var(--s2);white-space:pre-wrap}
.ver{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line2)}
.ver:last-child{border-bottom:none}
.vnum{font-size:var(--fs-sm);font-weight:var(--w-semi);font-variant-numeric:tabular-nums;min-width:26px}
.vwhen{font-size:var(--fs-sm);color:var(--ink2)}
.vtag{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ok);background:var(--ok-bg);padding:1px 6px;border-radius:var(--r-sm)}
.vwho{font-size:var(--fs-xs);color:var(--ink4);margin-left:auto}
#dficha{margin-top:var(--s4);display:grid;gap:var(--s4)}
#dficha .k{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--ink4)}
#dficha .v{font-size:var(--fs-ui);margin-top:2px}

/* trilho de ações */
#drail{position:sticky;top:var(--s6);align-self:start;display:flex;flex-direction:column;gap:var(--s2)}
.act{display:flex;align-items:center;gap:var(--s2);width:100%;padding:10px var(--s3);text-align:left;
  border:1px solid var(--line);border-radius:var(--r-md);font-size:var(--fs-ui);color:var(--ink3);
  background:var(--surface);transition:border-color var(--dur)}
.act:hover{border-color:var(--line3);color:var(--ink)}
.act-pri{background:var(--acc-btn);border-color:var(--acc-btn);color:#FFFFFF;font-weight:var(--w-semi)}
.act-pri:hover{background:var(--acc-btn-h);border-color:var(--acc-btn-h);color:#FFFFFF}
.railsep{height:1px;background:var(--line);margin:var(--s3) 0}

/* formulário de parecer */
#pform{margin-top:var(--s4)}
.vbtns{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.vbtn{flex:1;padding:9px var(--s2);border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);font-size:var(--fs-sm);color:var(--ink2);transition:all var(--dur)}
.vbtn:hover{border-color:var(--line3);color:var(--ink)}
.vbtn.on-aprovada{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:var(--w-semi)}
.vbtn.on-ajustar{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:var(--w-semi)}
.vbtn.on-rejeitada{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:var(--w-semi)}
#pcom{width:100%;min-height:76px;padding:var(--s3);border:1px solid var(--line);border-radius:var(--r-md);
  font-size:var(--fs-ui);line-height:var(--lh-base);resize:vertical;background:var(--surface)}
#pcom:focus{outline:none;border-color:var(--acc)}
#pmeta{font-size:var(--fs-xs);color:var(--ink4);margin-top:var(--s2)}

/* ============================================================================
   ADMINISTRAÇÃO — painel sério, sem card colorido
   ========================================================================= */
#adm{display:grid;grid-template-columns:168px minmax(0,1fr);gap:var(--s12);margin-top:var(--s8)}
#admnav{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding-right:var(--s4)}
.admtab{padding:7px var(--s3);border-radius:var(--r-md);font-size:var(--fs-ui);color:var(--ink2);text-align:left}
.admtab:hover{background:var(--paper2)}
.admtab.on{color:var(--ink);font-weight:var(--w-semi);box-shadow:inset 2px 0 0 0 var(--acc);border-radius:0 var(--r-md) var(--r-md) 0}
.reg{padding:var(--s6) 0;border-bottom:1px solid var(--line)}
.reg:last-child{border-bottom:none}
.regtop{display:flex;align-items:flex-start;gap:var(--s6)}
.reglab{flex:1;min-width:0}
.reglab b{display:block;font-size:var(--fs-ui);font-weight:var(--w-semi)}
.reglab span{display:block;font-size:var(--fs-sm);color:var(--ink2);margin-top:var(--s1);max-width:46em}
.regctl{flex-shrink:0;display:flex;align-items:center;gap:var(--s2)}
.regctl input[type=number]{width:64px;height:34px;padding:0 var(--s2);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);text-align:center;font-variant-numeric:tabular-nums}
.regctl select{height:34px;padding:0 var(--s2);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.sw{position:relative;width:42px;height:24px;border-radius:100px;background:var(--line3);transition:background var(--dur)}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);
  transition:transform var(--dur)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"] i{transform:translateX(18px)}
.tab-lista{width:100%;border-collapse:collapse;margin-top:var(--s4)}
.tab-lista th{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:var(--tr-eyebrow);
  text-transform:uppercase;color:var(--ink4);text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)}
.tab-lista td{font-size:var(--fs-ui);padding:var(--s3);border-bottom:1px solid var(--line2);vertical-align:middle}
.tab-lista select{height:32px;padding:0 var(--s2);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.admnota{font-size:var(--fs-sm);color:var(--ink2);line-height:var(--lh-read);margin-top:var(--s4);max-width:52em}
.admnota code{background:var(--paper2);padding:1px 5px;border-radius:var(--r-sm);font-size:var(--fs-sm)}

/* ============================================================================
   COMPARADOR E DIÁLOGOS
   ========================================================================= */
.ov{display:none;position:fixed;inset:0;background:rgba(31,29,27,.42);z-index:120;
  align-items:center;justify-content:center;padding:var(--s6)}
.ov.open{display:flex}
.dlg{background:var(--surface);border-radius:var(--r-lg);width:min(1180px,96vw);max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden}
.dlg-sm{width:min(440px,94vw);padding:var(--s8)}
.dlghead{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s6);border-bottom:1px solid var(--line)}
.dlghead h2{font-size:var(--fs-lg);font-weight:var(--w-semi);flex:1}
.dlghead select{padding:5px var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-sm)}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.col{overflow:auto;padding:var(--s6)}
.col:first-child{border-right:1px solid var(--line)}
.coltit{font-size:var(--fs-2xs);font-weight:var(--w-semi);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--ink4)}
.colid{font-size:var(--fs-sm);font-weight:var(--w-semi);color:var(--info);margin:var(--s1) 0 var(--s3)}
.coltxt{font-size:var(--fs-ui);line-height:var(--lh-read);white-space:pre-wrap}
.df-del{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.df-add{background:var(--ok-bg);color:var(--ok)}
.dlgleg{padding:var(--s3) var(--s6);border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink2)}
.dlg-sm h2{font-size:var(--fs-lg);font-weight:var(--w-semi)}
.dlg-sm p{font-size:var(--fs-base);color:var(--ink3);line-height:var(--lh-read);margin-top:var(--s3)}
.dlgacts{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s6)}
.dbtn{padding:10px var(--s4);border:1px solid var(--line3);border-radius:var(--r-md);font-size:var(--fs-ui)}
.dbtn:hover{background:var(--paper2)}
.dbtn-pri{background:var(--acc-btn);border-color:var(--acc-btn);color:#FFFFFF;font-weight:var(--w-semi)}
.dbtn-pri:hover{background:var(--acc-btn-h);color:#FFFFFF}

#toast{position:fixed;left:50%;bottom:var(--s8);transform:translate(-50%,14px);background:var(--ink);
  color:#FFFFFF;font-size:var(--fs-ui);padding:11px var(--s6);border-radius:var(--r-md);opacity:0;
  pointer-events:none;transition:all var(--dur);z-index:300;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================================
   TELAS ESTREITAS
   ========================================================================= */
@media (max-width:900px){
  #gwrap{grid-template-columns:1fr}
  #gbrand{border-right:none;border-bottom:1px solid var(--line);padding:38px 26px 32px;justify-content:flex-start}
  #gmark{width:232px}
  #ghead{margin-top:22px;font-size:var(--fs-xl)}
  #gsub{display:none}
  #gform{justify-content:center;padding:34px 22px 52px}
  .gbox{margin-bottom:0}
  .gbtn{width:100%}
  #body{grid-template-columns:1fr}
  nav{border-right:none;border-bottom:1px solid var(--line);padding:var(--s4) var(--s4) var(--s3);
    display:flex;gap:var(--s1);overflow-x:auto}
  .ngroup{display:none}
  .nitem{width:auto;white-space:nowrap}
  main{padding:var(--s8) var(--s4)}
  #hsearch{width:auto;flex:1}
  #hprod,#hkbd,#huser span{display:none}
  #det{grid-template-columns:1fr;gap:var(--s8)}
  #drail{position:static;flex-direction:row;flex-wrap:wrap}
  .act{width:auto}
  .cols{grid-template-columns:1fr}
  .col:first-child{border-right:none;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let DATA = [], PARECERES = [], EU = null;
let st = { vista:"landing", aba:"minha", q:"", sel:null, abertos:new Set(), temasAbertos:new Set() };
let HIST = [], CONFIG = [], PERFIS = [], TIPOS = [], TEMAS = [];
const ehAdmin = () => EU && ["coordenador","socio"].includes(EU.papel);
const cfgv = k => { const c = CONFIG.find(x=>x.chave===k); return c ? c.valor : null; };
const VROT = { aprovada:"Aprovada", ajustar:"Com ajuste", rejeitada:"Rejeitada" };
const esc = s => (""+(s??"")).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---- leitura de pareceres -------------------------------------------------- */
const pareceresDe   = id => PARECERES.filter(p => p.clausula_id === id);
const validosDe     = id => pareceresDe(id).filter(p => !p.texto_mudou_depois);
const meuParecer    = id => validosDe(id).find(p => EU && p.autor === EU.nome);
const temDivergencia= id => new Set(validosDe(id).map(p=>p.veredito)).size > 1;
const temVencido    = id => pareceresDe(id).some(p => p.texto_mudou_depois);
const pendentePraMim= c  => !meuParecer(c.id) && c.status === "em_validacao";

function telaAcesso(html){
  const g = document.getElementById("gate");
  g.innerHTML = `<div id="gwrap">
    <div id="gbrand">
      <div id="gtex" aria-hidden="true">
        <i style="left:0;top:26%;width:100%;height:1px"></i>
        <i style="left:0;top:71%;width:100%;height:1px"></i>
        <i style="left:29%;top:0;width:1px;height:100%"></i>
        <i style="left:78%;top:0;width:1px;height:100%"></i>
      </div>
      <img id="gmark" src="${LOGO}" alt="Wolff e Scripes Advogados">
      <div id="geyebrow">Banco de Cláusulas</div>
      <div id="grule"></div>
      <h1 id="ghead">O conhecimento jurídico do escritório, organizado.</h1>
      <p id="gsub">Consulte, compare e reutilize cláusulas validadas pelo time do escritório.</p>
    </div>
    <div id="gform">${html}</div>
  </div>`;
  g.style.display = "block";
  document.getElementById("app").classList.remove("on");
}

function telaFalha(titulo, tecnico){
  console.error("[Banco de Cláusulas] " + tecnico);
  window.__det = tecnico;
  telaAcesso(`<div class="gbox">
    <h2>${titulo}</h2>
    <p class="glead">Estamos com uma indisponibilidade temporária. Tente novamente em alguns
      instantes ou fale com a coordenação.</p>
    <button class="gbtn" onclick="location.reload()">Tentar novamente</button>
    <button class="glink" style="margin-left:14px" onclick="verDetalhe()">Detalhes técnicos</button>
    <div class="gmsg" id="gdet" style="display:none"></div></div>`);
}
function verDetalhe(){
  const d = document.getElementById("gdet");
  d.style.display = "block"; d.textContent = window.__det || "Sem detalhe registrado.";
}

/* Link de recuperação: o Supabase devolve a pessoa aqui já autenticada numa
   sessão de recuperação. Se entrássemos direto no app, ela nunca definiria a
   senha nova — então a checagem vem antes do login automático. */
let RECUPERANDO = /type=recovery/.test(location.hash) || /error_code=otp_expired/.test(location.hash);
sb.auth.onAuthStateChange((evt) => {
  if(evt === "PASSWORD_RECOVERY"){ RECUPERANDO = true; telaNovaSenha(); }
});

async function iniciaAcesso(){
  if(RECUPERANDO) return telaNovaSenha();
  const { data:{ session } } = await sb.auth.getSession();
  if(session) return carregaPerfil(session.user);
  telaAcesso(`<div class="gbox">
    <div class="geyebrow2">Acesso restrito</div>
    <div class="gfield">
      <label for="gmail">E-mail corporativo</label>
      <input id="gmail" type="email" placeholder="nome@wsa.adv.br" autocomplete="username" autocapitalize="off" spellcheck="false">
    </div>
    <div class="gfield">
      <label for="gsenha">Senha</label>
      <div class="gpwrap">
        <input id="gsenha" type="password" autocomplete="current-password">
        <button id="gtoggle" type="button" aria-label="Mostrar senha" aria-pressed="false" onclick="alternaSenha()">${ICO_OLHO}</button>
      </div>
    </div>
    <div class="gaux"><button class="glink" onclick="ajudaSenha()">Esqueceu sua senha?</button></div>
    <button class="gbtn" id="gentrar" onclick="entraSenha()">Entrar</button>
    <div class="gmsg" id="gmsg" role="status" aria-live="polite"></div></div>`);
  const ent = e => { if(e.key === "Enter") entraSenha(); };
  document.getElementById("gmail").onkeydown = ent;
  document.getElementById("gsenha").onkeydown = ent;
}

function alternaSenha(){
  const i = document.getElementById("gsenha"), b = document.getElementById("gtoggle");
  const most = i.type === "text";
  i.type = most ? "password" : "text";
  b.innerHTML = most ? ICO_OLHO : ICO_OFF;
  b.setAttribute("aria-label", most ? "Mostrar senha" : "Ocultar senha");
  b.setAttribute("aria-pressed", most ? "false" : "true");
  i.focus();
}
/* Redefinição por e-mail exige SMTP próprio (o serviço embutido do Supabase só
   entrega para a equipe do projeto). Enquanto não houver, a coordenação redefine
   pelo painel. Para ligar o envio: troque o corpo desta função pela chamada
   sb.auth.resetPasswordForEmail(email, { redirectTo: CFG.REDIRECT }) — a tela de
   nova senha (telaNovaSenha) já está implementada e trata link expirado. */
function ajudaSenha(){
  const m = document.getElementById("gmsg");
  m.className = "gmsg";
  m.textContent = "A redefinição é feita pela coordenação. Peça a redefinição pelo Teams.";
}

function telaNovaSenha(){
  const expirado = /otp_expired|access_denied/.test(location.hash);
  telaAcesso(`<div class="gbox">
    <div class="geyebrow2">Definir nova senha</div>
    ${expirado ? `<p class="glead">Este link expirou ou já foi usado. Peça um novo na tela de
      acesso.</p><button class="gbtn" onclick="limpaHash()">Voltar ao acesso</button>`
    : `<p class="glead">Escolha uma senha de no mínimo 8 caracteres.</p>
    <div class="gfield">
      <label for="ns1">Nova senha</label>
      <div class="gpwrap">
        <input id="ns1" type="password" autocomplete="new-password">
        <button id="gtoggle" type="button" aria-label="Mostrar senha" aria-pressed="false"
                onclick="alternaCampo('ns1',this)">${ICO_OLHO}</button>
      </div>
    </div>
    <div class="gfield">
      <label for="ns2">Repita a nova senha</label>
      <input id="ns2" type="password" autocomplete="new-password">
    </div>
    <button class="gbtn" id="nsbtn" onclick="salvaNovaSenha()">Salvar senha</button>`}
    <div class="gmsg" id="gmsg" role="status" aria-live="polite"></div></div>`);
  const i = document.getElementById("ns2");
  if(i) i.onkeydown = e => { if(e.key === "Enter") salvaNovaSenha(); };
}
function limpaHash(){ location.replace(location.pathname); }

async function salvaNovaSenha(){
  const a = document.getElementById("ns1").value||"";
  const b = document.getElementById("ns2").value||"";
  const m = document.getElementById("gmsg"), bt = document.getElementById("nsbtn");
  if(a.length < 8){ m.className="gmsg erro"; m.textContent="A senha precisa ter ao menos 8 caracteres."; return; }
  if(a !== b){ m.className="gmsg erro"; m.textContent="As duas senhas não são iguais."; return; }
  m.className="gmsg"; m.textContent="Salvando…"; bt.disabled = true;
  const { data, error } = await sb.auth.updateUser({ password: a });
  if(error){
    m.className="gmsg erro"; m.textContent = "Não foi possível salvar: " + error.message;
    bt.disabled = false; return;
  }
  RECUPERANDO = false;
  history.replaceState(null, "", location.pathname);
  carregaPerfil(data.user);
}

function alternaCampo(id, btn){
  const i = document.getElementById(id);
  const most = i.type === "text";
  i.type = most ? "password" : "text";
  btn.innerHTML = most ? ICO_OLHO : ICO_OFF;
  btn.setAttribute("aria-label", most ? "Mostrar senha" : "Ocultar senha");
  btn.setAttribute("aria-pressed", most ? "false" : "true");
  i.focus();
}

async function entraSenha(){
  const email = (document.getElementById("gmail").value||"").trim();
  const senha = document.getElementById("gsenha").value||"";
  const m = document.getElementById("gmsg"), bt = document.getElementById("gentrar");
  if(!email.includes("@") || !senha){ m.className="gmsg erro"; m.textContent="Informe e-mail e senha."; return; }
  m.className="gmsg"; m.textContent="Entrando…";
  bt.disabled = true; bt.textContent = "Entrando…";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){
    m.className="gmsg erro";
    m.textContent = error.message.toLowerCase().includes("invalid")
      ? "E-mail ou senha incorretos." : "Não foi possível entrar: " + error.message;
    bt.disabled = false; bt.textContent = "Entrar";
    return;
  }
  carregaPerfil(data.user);
}

async function carregaPerfil(user){
  const { data, error } = await sb.from("perfis").select("nome,papel").eq("id", user.id).single();
  if(error || !data){
    return telaAcesso(`<div class="gbox">
      <h2>Seu acesso ainda não foi liberado</h2>
      <p class="glead">Sua conta existe, mas o perfil não foi vinculado. Fale com a coordenação
        para concluir a liberação.</p>
      <button class="gbtn" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</button></div>`);
  }
  EU = { nome:data.nome, papel:data.papel, autor_id:user.id, verificado:true };
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").classList.add("on");
  document.getElementById("hlogo").src = LOGO;
  document.getElementById("hnome").textContent = EU.nome.split(" ")[0];
  document.getElementById("havatar").textContent =
    EU.nome.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
  carregaTudo();
}
async function sai(){ await sb.auth.signOut(); location.reload(); }

/* ============================================================================
   2. DADOS
   ========================================================================= */
async function carregaTudo(){
  document.getElementById("main").innerHTML = `<p class="lead">Carregando cláusulas…</p>`;
  const [cl, pa, cf] = await Promise.all([
    sb.from("clausulas").select("*").order("id"),
    sb.from("vw_parecer_atual").select("*"),
    sb.from("config").select("*").order("grupo").order("ordem")
  ]);
  if(cl.error) return telaFalha("Não foi possível carregar o acervo", cl.error.message);
  DATA = cl.data;
  PARECERES = pa.error ? [] : pa.data;
  CONFIG = cf.error ? [] : cf.data;
  if(pa.error) toast("Cláusulas carregadas, mas os pareceres falharam: " + pa.error.message);
  st.vista = "landing";
  render();
}
async function recarregaPareceres(){
  const { data, error } = await sb.from("vw_parecer_atual").select("*");
  if(!error) PARECERES = data;
  render();
}

/* ============================================================================
   3. NAVEGAÇÃO
   ========================================================================= */
function vai(v){
  st.vista = v; st.sel = null; window.scrollTo(0,0); render();
  if(v === "config" && ehAdmin() && !PERFIS.length) carregaPerfis();
}
async function carregaPerfis(){
  const { data, error } = await sb.from("perfis").select("*").order("nome");
  if(!error){ PERFIS = data; if(st.vista === "config") render(); }
}

function renderNav(){
  const pend = DATA.filter(pendentePraMim).length;
  const itens = [
    ["", [["landing","Início",null]]],
    ["Acervo", [["validacoes","Validações",pend?pend+" pendentes":"em dia"],
                ["clausulas","Cláusulas",DATA.length]]],
    ["Registro", [["historico","Histórico",null]]]
  ];
  if(ehAdmin()) itens.push(["Administração", [["config","Configurações",null]]]);
  document.getElementById("nav").innerHTML = itens.map(([g,is]) =>
    (g?`<div class="ngroup">${g}</div>`:"") + is.map(([v,rot,n]) =>
      `<button class="nitem ${st.vista===v||(v==="validacoes"&&st.vista==="detalhe")?"on":""}" onclick="vai('${v}')">
        <span>${rot}</span>${n!==null?`<span class="ncount">${n}</span>`:""}</button>`).join("")
  ).join("");
}

function render(){
  renderNav();
  const m = document.getElementById("main");
  if(st.vista === "detalhe")        m.innerHTML = htmlDetalhe();
  else if(st.vista === "landing")   m.innerHTML = htmlLanding();
  else if(st.vista === "historico") m.innerHTML = htmlHistorico();
  else if(st.vista === "config")    m.innerHTML = htmlConfig();
  else                              m.innerHTML = htmlArvore();
  if(st.vista === "detalhe") pintaParecer();
}

/* ============================================================================
   4. LANDING ADAPTATIVA
   A tela muda com o estágio do trabalho: enquanto há backlog, ela empurra para
   a validação. Zerado o backlog, vira ferramenta de consulta.
   ========================================================================= */
function htmlLanding(){
  const pend = DATA.filter(pendentePraMim).length;
  const validadas = DATA.filter(c=>c.status==="validada").length;
  const comParecer = DATA.filter(c=>validosDe(c.id).length>0).length;

  if(pend > 0){
    /* "Iniciar" antes do primeiro parecer, "Continuar" depois: o rótulo conta em
       que ponto do trabalho a pessoa está. */
    const meus = PARECERES.filter(p => EU && p.autor === EU.nome).length;
    const pct = DATA.length ? Math.round(100*comParecer/DATA.length) : 0;
    return `<div class="eyebrow">Sua fila de validação</div>
      <h1>${pend} ${pend===1?"cláusula aguarda":"cláusulas aguardam"} seu parecer.</h1>
      <p class="lead">A base está em validação. Seus pareceres contribuem para a consolidação
        do conhecimento jurídico do escritório, e ficam visíveis para todo o time.</p>
      <button class="cta" onclick="vai('validacoes')">${meus ? "Continuar" : "Iniciar"} validação →</button>
      <button class="cta-ghost" onclick="vai('clausulas')">Ver todo o acervo</button>
      <div id="lprog">
        <div class="slabel" style="border:none;padding:0">Progresso da validação</div>
        <div class="pgline"><span class="num">${comParecer} de ${DATA.length}</span>
          <span class="pgpct num">${pct}%</span></div>
        <div class="pgbar"><i style="width:${pct}%"></i></div>
        <div class="pgnote">${validadas} ${validadas===1?"cláusula validada":"cláusulas validadas"}
          pelo escritório${comParecer&&!validadas?" · aguardando carimbo da coordenação":""}</div>
      </div>`;
  }
  return `<div class="eyebrow">Banco de Cláusulas</div>
    <h1>O conhecimento jurídico do escritório, organizado.</h1>
    <p class="lead">Pesquise, compare e reutilize cláusulas validadas pelo time.</p>
    <div id="lbusca">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="var(--ink4)" stroke-width="1.6"/><path d="M11 11l3.4 3.4" stroke="var(--ink4)" stroke-width="1.6"/></svg>
      <label class="sr" for="qb">Pesquisar cláusula</label>
      <input id="qb" type="text" placeholder="Pesquise por cláusula, tema ou expressão"
             value="${esc(st.q)}" oninput="st.q=this.value" onkeydown="if(event.key==='Enter')vai('clausulas')">
    </div>
    <div id="lprog">
      <div class="slabel" style="border:none;padding:0">Progresso da validação</div>
      <div class="pgline"><span class="num">${validadas} de ${DATA.length} validadas</span>
        <span class="pgpct num">${DATA.length?Math.round(100*validadas/DATA.length):0}%</span></div>
      <div class="pgbar"><i style="width:${DATA.length?100*validadas/DATA.length:0}%"></i></div>
    </div>`;
}

/* ============================================================================
   5. ÁRVORE — documento > tema > cláusula, como organização da fila
   ========================================================================= */
function conjunto(){
  const q = st.q.trim().toLowerCase();
  let L = DATA;
  if(st.vista === "validacoes"){
    if(st.aba === "minha")      L = L.filter(pendentePraMim);
    else if(st.aba === "feitas")L = L.filter(c => meuParecer(c.id) || c.status === "validada");
  }
  if(q) L = L.filter(c => (c.nome+" "+c.tema+" "+c.tipo+" "+c.id+" "+c.texto).toLowerCase().includes(q));
  return L;
}

function htmlArvore(){
  const valida = st.vista === "validacoes";
  const L = conjunto();
  const pend = DATA.filter(pendentePraMim).length;
  const feitas = DATA.filter(c => meuParecer(c.id) || c.status === "validada").length;

  let head = valida
    ? `<div class="eyebrow">Validações</div>
       <h1>${DATA.length} cláusulas · ${DATA.filter(c=>c.status==="validada").length} validadas</h1>
       <div class="tabs" role="tablist">
         ${[["minha","Minha fila",pend],["todas","Todas",DATA.length],["feitas","Concluídas",feitas]]
           .map(([k,r,n])=>`<button class="tab ${st.aba===k?"on":""}" role="tab"
             aria-selected="${st.aba===k}" onclick="st.aba='${k}';render()">${r}<span class="tabcount">${n}</span></button>`).join("")}
       </div>`
    : `<div class="eyebrow">Cláusulas</div>
       <h1>${L.length} ${L.length===1?"registro":"registros"}${st.q?" para a busca":""}</h1>
       <div class="tabs"></div>`;

  if(!L.length){
    const vazio = valida && st.aba==="minha"
      ? "Nada aguardando seu parecer. O backlog da sua fila está zerado."
      : "Nenhuma cláusula corresponde à busca.";
    return head + `<p class="vazio">${vazio}</p>`;
  }

  // agrupa por tipo de documento, depois por tema
  const docs = {};
  L.forEach(c => { (docs[c.tipo] = docs[c.tipo] || []).push(c); });

  const corpo = Object.keys(docs).sort((a,b)=>a.localeCompare(b,"pt")).map(tipo => {
    const g = docs[tipo];
    const total = DATA.filter(c=>c.tipo===tipo).length;
    const feito = DATA.filter(c=>c.tipo===tipo && validosDe(c.id).length>0).length;
    const pct = total ? Math.round(100*feito/total) : 0;
    const aberto = st.abertos.has(tipo) || !!st.q;

    const temas = {};
    g.forEach(c => { (temas[c.tema] = temas[c.tema] || []).push(c); });
    const htmlTemas = Object.keys(temas).sort((a,b)=>a.localeCompare(b,"pt")).map(tema => {
      const ct = temas[tema];
      const chave = tipo+"§"+tema;
      const tAberto = st.temasAbertos.has(chave) || !!st.q || Object.keys(temas).length === 1;
      const tFeito = ct.filter(c=>validosDe(c.id).length>0).length;
      return `<div class="tema">
        <button class="thead" aria-expanded="${tAberto}" onclick="togTema('${esc(chave).replace(/'/g,"\\'")}')">
          <span class="dcar">▸</span><span class="tname">${esc(tema)}</span>
          <span class="tfrac">${tFeito}/${ct.length}</span></button>
        ${tAberto ? ct.map(c=>linhaClausula(c)).join("") : ""}</div>`;
    }).join("");

    return `<div class="doc">
      <button class="dhead" aria-expanded="${aberto}" onclick="togDoc('${esc(tipo).replace(/'/g,"\\'")}')">
        <span class="dcar">▸</span>
        <span class="dname">${esc(tipo)}</span>
        <span class="dprog"><span class="dfrac">${feito}/${total}</span>
          <span class="bar"><i style="width:${pct}%"></i></span></span></button>
      ${aberto ? `<div class="temas">${htmlTemas}</div>` : ""}</div>`;
  }).join("");

  return head + corpo;
}

function linhaClausula(c){
  const meu = meuParecer(c.id);
  const et = c.status === "validada" ? `<span class="et et-val">Validada</span>`
    : meu ? `<span class="et et-${meu.veredito.slice(0,3)}">${VROT[meu.veredito]}</span>` : "";
  const div = temDivergencia(c.id) ? `<span class="et et-div">Divergência</span>` : "";
  const ven = temVencido(c.id) ? `<span class="et et-aju">Parecer vencido</span>` : "";
  const n = validosDe(c.id).length;
  const outros = !meu && n ? `<span class="clid">${n} parecer${n>1?"es":""}</span>` : "";
  return `<button class="cl" onclick="abre('${c.id}')">
    <span class="clname">${esc(c.nome)}</span>
    ${c.classificacao==="Alternativa"?`<span class="et et-emv">Alternativa</span>`:""}
    ${et}${div}${ven}${outros}
    <span class="et et-risco-${c.risco}">${c.risco}</span>
    <span class="clid">${c.id}</span></button>`;
}
function togDoc(t){ st.abertos.has(t) ? st.abertos.delete(t) : st.abertos.add(t); render(); }
function togTema(k){ st.temasAbertos.has(k) ? st.temasAbertos.delete(k) : st.temasAbertos.add(k); render(); }

/* ============================================================================
   6. DETALHE DA CLÁUSULA

async function abre(id){
  st.sel = id; st.vista = "detalhe"; HIST = [];
  window.scrollTo(0,0); render();
  const { data, error } = await sb.from("clausula_historico")
    .select("versao,texto,motivo,criado_em,autor_id").eq("clausula_id", id).order("versao",{ascending:false});

}

        Use com revisão do responsável pela demanda.</div>` : ""}

      <div class="sec">
        <div class="slabel">Redação</div>
        <div id="dtexto">${esc(c.texto)}</div>
      </div>

      <div class="sec">
        <div class="slabel">Meu parecer</div>
        <div id="pform">
          <div class="vbtns">
            ${["aprovada","ajustar","rejeitada"].map(v=>`<button class="vbtn" id="v-${v}"
              onclick="vota('${v}')">${v==="aprovada"?"Aprovar":v==="ajustar"?"Aprovar com ajuste":"Rejeitar"}</button>`).join("")}
          </div>
          <label class="sr" for="pcom">Comentário do parecer</label>
          <textarea id="pcom" placeholder="Comentário. Obrigatório para ajuste e rejeição."></textarea>
          <div id="pmeta"></div>

      <div class="sec">

            <div class="parhead">
              <span class="et et-${p.veredito.slice(0,3)}">${VROT[p.veredito]}</span>
              <span class="parwho">${esc(p.autor)}</span>
              <span class="parpapel">${esc(p.papel)}</span>
              ${p.autor_verificado===false?`<span class="et et-aju">não verificado</span>`:""}
              <span class="parwhen">${dataBr(p.criado_em)}</span>
            </div>
            ${p.comentario?`<div class="parcom">${esc(p.comentario)}</div>`:""}
          </div>`).join("")
        : `<p class="par parcom">Nenhum outro parecer nesta cláusula ainda.</p>`}
        ${vencidos.length?`<div class="par"><div class="parcom">
          ${vencidos.length} parecer${vencidos.length>1?"es":""} anterior${vencidos.length>1?"es":""}
          deixou de valer porque o texto foi reescrito depois da avaliação.</div></div>`:""}
      </div>

      <div class="sec">
        <div class="slabel">Histórico de versões</div>
        ${HIST.length ? HIST.map((h,i)=>`<div class="ver">
            <span class="vnum">v${h.versao}</span>
            <span class="vwhen">${dataBr(h.criado_em)}</span>
            ${i===0?`<span class="vtag">Atual</span>`:""}
            <span class="vwho">${esc(h.motivo||"")}</span></div>`).join("")
          : `<p class="parcom" style="padding-top:12px">Carregando…</p>`}
      </div>

      <div class="sec">
        <div class="slabel">Ficha</div>
        <div id="dficha">
          <div><div class="k">Área responsável</div><div class="v">${esc(c.area)}</div></div>
          <div><div class="k">Recorrência na amostra</div><div class="v">${esc(c.freq||"—")}</div></div>
          <div><div class="k">Texto-base</div><div class="v">${esc(c.revisao||"—")}</div></div>
          ${c.notas?`<div><div class="k">Notas de uso</div><div class="v">${esc(c.notas)}</div></div>`:""}
        </div>
      </div>
    </div>

    <div id="drail">
      <button class="act act-pri" onclick="copia()">Copiar cláusula</button>
      ${temVar?`<button class="act" onclick="comparar()">Comparar variações</button>`:""}
      ${podeCarimbar && emValidacao?`<div class="railsep"></div>
        <button class="act" onclick="pedeValidar()">Marcar como validada</button>
        <div class="pgnote" style="margin-top:6px">${criterioTexto(c)}</div>`:""}
      <div class="railsep"></div>
      <button class="act" onclick="proxima()">Próxima da fila →</button>
      <button class="act" onclick="vai('validacoes')">Voltar à lista</button>
    </div>
  </div>`;
}

/* Espelha fn_impedimento_validacao do banco. A checagem que vale é a de lá; esta
   existe para a pessoa saber o que falta antes de clicar e levar erro. */
function criterioTexto(c){
  const min = cfgv("pareceres_minimos") || 1;
  const validos = validosDe(c.id);
  const distintos = new Set(validos.map(p=>p.veredito)).size;
  const socioReg = cfgv("parecer_socio");
  const temSocio = validos.some(p=>p.papel==="socio");
  if(validos.length < min) return `Faltam pareceres: ${validos.length} de ${min}.`;
  if(cfgv("exigir_concordancia") !== false && distintos > 1) return "Há divergência a resolver.";
  if((socioReg==="sempre" || (socioReg==="risco_alto" && c.risco==="Alto")) && !temSocio)
    return "Falta parecer de sócio.";
  return "Critério atendido.";
}

const dataBr = s => s ? new Date(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}) : "—";

function pintaParecer(){
  const meu = meuParecer(st.sel) || {};
  ["aprovada","ajustar","rejeitada"].forEach(v=>{
    const b = document.getElementById("v-"+v);
    if(b) b.className = "vbtn" + (meu.veredito===v ? " on-"+v : "");
  });
  const ta = document.getElementById("pcom");
  if(ta && document.activeElement !== ta) ta.value = meu.comentario || "";
  const m = document.getElementById("pmeta");
  if(m) m.textContent = meu.veredito
    ? `Seu parecer: ${VROT[meu.veredito]} em ${dataBr(meu.criado_em)}`
    : "Você ainda não registrou parecer nesta cláusula.";
}

function proxima(){
  const fila = DATA.filter(pendentePraMim);
  if(!fila.length){ toast("Sua fila está zerada."); return vai("landing"); }
  const i = fila.findIndex(c=>c.id===st.sel);
  abre(fila[(i+1) % fila.length].id);
}

/* ============================================================================
   7. ESCRITA
   Escrita barrada por RLS não gera erro: retorna sucesso com zero linhas.
   Todo insert/update confere o retorno antes de dizer que gravou.
   ========================================================================= */
async function vota(v){
  if(!st.sel || !EU) return;
  const com = (document.getElementById("pcom").value||"").trim();
  if((v==="ajustar"||v==="rejeitada") && !com && cfgv("exigir_justificativa_divergencia") !== false){
    toast("Descreva o ajuste ou o motivo antes de registrar"); return;
  }
  const linha = { clausula_id: st.sel, autor_id: EU.autor_id, veredito: v, comentario: com||null };
  const { data, error } = await sb.from("pareceres").insert(linha).select();
  if(error) return toast("Não gravou: " + error.message);
  if(!data || !data.length) return toast("Não gravou — sem permissão para registrar parecer.");
  toast(`Parecer "${VROT[v]}" registrado e visível ao time`);
  await recarregaPareceres();
}

function pedeValidar(){
  const c = DATA.find(x=>x.id===st.sel);
  confirma("Marcar como validada?",
    `A redação de ${c.id} passa a constar como padrão validado do escritório e fica disponível `+
    `para uso em documentos de cliente.`, "Marcar como validada", validaClausula);
}
async function validaClausula(){
  fechaConf();
  const { data, error } = await sb.from("clausulas")
    .update({ status:"validada", validada_por:EU.autor_id, validada_em:new Date().toISOString() })
    .eq("id", st.sel).select();
  if(error) return toast("Não validou: " + error.message);
  if(!data || !data.length) return toast("Não validou — somente coordenação ou sócio pode carimbar.");
  const i = DATA.findIndex(c=>c.id===st.sel);
  if(i>=0) DATA[i] = data[0];
  toast("Cláusula marcada como validada");
  render();
}

/* Governança no ponto de consumo: copiar cláusula não validada exige confirmação.
   É o único lugar do sistema em que uma decisão errada chega a documento de cliente. */
function copia(){
  const c = DATA.find(x=>x.id===st.sel); if(!c) return;
  if(c.status === "em_validacao" && cfgv("copiar_em_validacao") === false){
    return toast("A configuração do escritório não permite copiar cláusula em validação.");
  }
  if(c.status === "em_validacao"){
    return confirma("Esta cláusula ainda está em validação",
      "A redação não constitui padrão validado pela WSA. Deseja copiar mesmo assim?",
      "Copiar mesmo assim", ()=>{ fechaConf(); copiaTexto(c); });
  }
  copiaTexto(c);
}
function copiaTexto(c){
  navigator.clipboard.writeText(c.texto)
    .then(()=>toast(c.status==="em_validacao" ? "Cláusula copiada — texto em validação" : "Cláusula copiada"))
    .catch(()=>toast("Não foi possível copiar — selecione o texto"));
}

/* ============================================================================
   8. DIÁLOGO DE CONFIRMAÇÃO
   ========================================================================= */
let acaoConf = null;
function confirma(titulo, msg, rotulo, fn){
  document.getElementById("conftit").textContent = titulo;
  document.getElementById("confmsg").textContent = msg;
  const ok = document.getElementById("confok");
  ok.textContent = rotulo;
  acaoConf = fn; ok.onclick = () => acaoConf && acaoConf();
  document.getElementById("confov").classList.add("open");
  ok.focus();
}
function fechaConf(){ document.getElementById("confov").classList.remove("open"); acaoConf = null; }

function abreBeta(){
  confirma("Base em validação",
    "A base está sendo estruturada e revisada continuamente pelo time. Cláusulas marcadas como "+
    "\u201cEm validação\u201d ainda não constituem padrão validado do escritório.",
    "Entendi", fechaConf);
}

/* ============================================================================
   13. ADMINISTRAÇÃO
   Cada item aqui é regra estrutural do produto. Nada de estética: cor, densidade
   e layout são design system e ficam fixos de propósito.
   As regras de validação são cobradas pelo banco (gatilho + função de critério);
   esta tela só edita o parâmetro. Mudar aqui muda o comportamento do banco.
   ========================================================================= */
let admAba = "validacao";

function htmlConfig(){
  if(!ehAdmin()) return `<p class="vazio">Área restrita à coordenação.</p>`;
  const abas = [["validacao","Validação"],["governanca","Governança"],
                ["usuarios","Usuários"],["acervo","Acervo"]];
  return `<div class="eyebrow">Administração</div>
    <h1>Configurações</h1>
    <p class="lead">Regras estruturais do Banco de Cláusulas. As alterações valem para todo
      o time e ficam registradas com autor e data.</p>
    <div id="adm">
      <div id="admnav">${abas.map(([k,r])=>`<button class="admtab ${admAba===k?"on":""}"
        onclick="admAba='${k}';render()">${r}</button>`).join("")}</div>
      <div>${admAba==="usuarios" ? admUsuarios() : admAba==="acervo" ? admAcervo() : admRegras(admAba)}</div>
    </div>`;
}

function admRegras(grupo){
  const L = CONFIG.filter(c => c.grupo === grupo);
  if(!L.length) return `<p class="vazio">Nenhuma regra neste grupo.</p>`;
  const nota = grupo === "validacao"
    ? `Estas regras são cobradas pelo banco de dados, não apenas pela tela: uma cláusula que
       não atende ao critério não pode ser marcada como validada nem por via direta.`
    : `Estas regras valem no ponto de consumo e na edição do acervo.`;
  return L.map(c => {
    let ctl;
    if(c.tipo_campo === "inteiro")
      ctl = `<input type="number" min="1" max="9" value="${c.valor}"
        aria-label="${esc(c.rotulo)}" onchange="salvaCfg('${c.chave}', Number(this.value))">`;
    else if(c.tipo_campo === "booleano")
      ctl = `<button class="sw" role="switch" aria-checked="${c.valor===true}"
        aria-label="${esc(c.rotulo)}" onclick="salvaCfg('${c.chave}', ${!(c.valor===true)})"><i></i></button>`;
    else
      ctl = `<select aria-label="${esc(c.rotulo)}" onchange="salvaCfg('${c.chave}', this.value)">
        ${(c.opcoes||[]).map(o=>`<option value="${o.v}" ${o.v===c.valor?"selected":""}>${esc(o.r)}</option>`).join("")}
      </select>`;
    return `<div class="reg"><div class="regtop">
      <div class="reglab"><b>${esc(c.rotulo)}</b><span>${esc(c.descricao||"")}</span></div>
      <div class="regctl">${ctl}</div></div></div>`;
  }).join("") + `<p class="admnota">${nota}</p>`;
}

async function salvaCfg(chave, valor){
  const { data, error } = await sb.from("config")
    .update({ valor, atualizado_por: EU.autor_id }).eq("chave", chave).select();
  if(error) return toast("Não gravou: " + error.message);
  if(!data || !data.length) return toast("Não gravou — sem permissão para alterar configuração.");
  const i = CONFIG.findIndex(c=>c.chave===chave);
  if(i>=0) CONFIG[i] = data[0];
  toast("Regra atualizada para todo o time");
  render();
}

function admUsuarios(){
  const papeis = [["advogado","Advogado — dá parecer"],
                  ["coordenador","Coordenação — edita texto, carimba e configura"],
                  ["socio","Sócio — idem coordenação"]];
  const corpo = PERFIS.length ? PERFIS.map(p=>{
    const n = PARECERES.filter(x=>x.autor===p.nome).length;
    return `<tr><td><b>${esc(p.nome)}</b><br><span style="color:var(--ink2);font-size:var(--fs-sm)">${esc(p.email)}</span></td>
      <td><select aria-label="Papel de ${esc(p.nome)}" onchange="salvaPapel('${p.id}', this.value)">
        ${papeis.map(([v,r])=>`<option value="${v}" ${v===p.papel?"selected":""}>${esc(r.split(" — ")[0])}</option>`).join("")}
      </select></td>
      <td class="num">${n}</td>
      <td><span class="et ${p.ativo?"et-val":"et-emv"}">${p.ativo?"Ativo":"Inativo"}</span></td></tr>`;
  }).join("") : `<tr><td colspan="4" style="color:var(--ink2)">Carregando…</td></tr>`;
  return `<table class="tab-lista">
      <thead><tr><th>Pessoa</th><th>Papel</th><th>Pareceres</th><th>Situação</th></tr></thead>
      <tbody>${corpo}</tbody></table>
    <p class="admnota">Contas novas são criadas no painel do Supabase, em Authentication → Users,
      com <code>Auto Confirm User</code> marcado. O perfil aparece aqui automaticamente, com papel
      <code>advogado</code>. Papel novo além destes três exige mudança nas políticas do banco —
      por isso não é configurável aqui.</p>`;
}

async function salvaPapel(id, papel){
  const { data, error } = await sb.from("perfis").update({ papel }).eq("id", id).select();
  if(error) return toast("Não gravou: " + error.message);
  if(!data || !data.length) return toast("Não gravou — sem permissão para alterar papéis.");
  const i = PERFIS.findIndex(p=>p.id===id);
  if(i>=0) PERFIS[i] = data[0];
  toast("Papel atualizado");
  render();
}

function admAcervo(){
  const porTipo = {}, porTema = {};
  DATA.forEach(c=>{ porTipo[c.tipo]=(porTipo[c.tipo]||0)+1; porTema[c.tema]=(porTema[c.tema]||0)+1; });
  const linhas = o => Object.keys(o).sort((a,b)=>o[b]-o[a])

      <tbody>${linhas(porTema)}</tbody></table>
    <p class="admnota">Renomear categoria propaga para todas as cláusulas e é operação de banco
      (<code>fn_renomeia_tipo</code> e <code>fn_renomeia_tema</code>), disponível para coordenação
      e sócio. Não coloquei o botão aqui de propósito: renomear <b>Outros</b>, que hoje concentra
      78 cláusulas, é decisão de taxonomia a tomar com o time, não clique de tela. Quando a
      decisão existir, a tela ganha o campo.</p>
    <p class="admnota">Status da cláusula e níveis de risco não são configuráveis: são tipos do
      banco, e criar um valor novo exige revisar políticas, gatilhos e telas. É migração pequena,
      mas explícita.</p>`;
}

const escCsv = s => '"' + (""+(s??"")).replace(/"/g,'""') + '"';
function baixa(nome, linhas){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+linhas.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download = nome; a.click();

function exportaVal(){
  if(!PARECERES.length) return toast("Nenhum parecer registrado ainda");
  const cab = ["ID","Cláusula","Documento","Tema","Risco","Autor","Papel","Verificado","Parecer","Comentário","Data","Texto mudou depois"];
  baixa("pareceres-"+new Date().toISOString().slice(0,10)+".csv",
    [cab.join(";")].concat(PARECERES.map(p=>{
      const c = DATA.find(x=>x.id===p.clausula_id) || {};

        p.autor_verificado?"Sim":"Não",VROT[p.veredito]||p.veredito,p.comentario,
        dataBr(p.criado_em),p.texto_mudou_depois?"Sim":"Não"].map(escCsv).join(";");
    })));
  toast(`${PARECERES.length} pareceres exportados`);
}

/* ============================================================================
   11. COMPARADOR
   ========================================================================= */
function grupoDe(id){
  const base = id.split("-A")[0];
  return DATA.filter(c=>c.id===base||c.id.startsWith(base+"-A")).sort((a,b)=>a.id.localeCompare(b.id));
}
let cmpPar = null;
function comparar(){
  const g = grupoDe(st.sel);
  if(g.length < 2) return toast("Esta cláusula não tem variação registrada");
  const base = g[0], vars = g.slice(1);
  const atual = DATA.find(x=>x.id===st.sel);
  const ini = atual.id !== base.id ? atual : vars[0];
  const sel = document.getElementById("cmpsel");
  sel.innerHTML = vars.map(v=>`<option value="${v.id}" ${v.id===ini.id?"selected":""}>${v.id}</option>`).join("");
  sel.style.display = vars.length > 1 ? "" : "none";
  cmpPar = base;
  document.getElementById("cmptit").textContent = "Comparar: " + base.nome;
  document.getElementById("cmpov").classList.add("open");
  renderCmp();
}
function fechaCmp(){ document.getElementById("cmpov").classList.remove("open"); }
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ fechaCmp(); fechaConf(); }
  if((e.ctrlKey||e.metaKey) && e.key === "k"){ e.preventDefault(); document.getElementById("q").focus(); }
});
function diffWords(a,b){
  const A=a.split(/\s+/), B=b.split(/\s+/), LIM=1400;
  const tA=A.slice(0,LIM), tB=B.slice(0,LIM), n=tA.length, m=tB.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j]= tA[i]===tB[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n&&j<m){
    if(tA[i]===tB[j]){ ops.push(["eq",tA[i]]); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ ops.push(["del",tA[i]]); i++; }
    else { ops.push(["add",tB[j]]); j++; }
  }
  while(i<n) ops.push(["del",tA[i++]]);
  while(j<m) ops.push(["add",tB[j++]]);
  if(A.length>LIM||B.length>LIM) ops.push(["eq","… (comparação limitada ao início)"]);
  return ops;
}
function renderCmp(){
  if(!cmpPar) return;
  const B = DATA.find(x=>x.id===document.getElementById("cmpsel").value);
  if(!B) return;
  const ops = diffWords(cmpPar.texto, B.texto);
  document.getElementById("cmpidA").textContent = cmpPar.id;
  document.getElementById("cmpidB").textContent = B.id;
  document.getElementById("cmptxtA").innerHTML = ops.filter(o=>o[0]!=="add")
    .map(o=>o[0]==="del"?`<span class="df-del">${esc(o[1])}</span>`:esc(o[1])).join(" ");
  document.getElementById("cmptxtB").innerHTML = ops.filter(o=>o[0]!=="del")
    .map(o=>o[0]==="add"?`<span class="df-add">${esc(o[1])}</span>`:esc(o[1])).join(" ");
}

function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(tT); tT = setTimeout(()=>t.classList.remove("show"), 3400);
